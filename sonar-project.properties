# Sonar configuration for @wellsfargo-starui/platform.
#
# Coverage is a single merged LCOV at the repo root, produced by
# `npm run test:coverage` (scripts/run-test-coverage.mjs), which concatenates
# every packages/<bucket>/<pkg>/coverage/lcov.info and rewrites each SF: record
# to a repo-relative path. Sonar resolves sources against sonar.projectBaseDir,
# so absolute SF: paths would be silently dropped as unmatched.
#
# See docs/package-coverage-and-sonar-lcov.md.

sonar.projectKey=wellsfargo-starui-platform
sonar.projectName=MarketsUI Platform

sonar.sources=packages
sonar.tests=packages
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8

# Never analysed: build output, dependencies, packed tarballs, and the one
# Angular package that is excluded from the build pipeline (see CLAUDE.md).
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/*.d.ts,\
  dist-npm/**,\
  packages/data/host-data-angular/**

# Generated or vendored source that should not be held to coverage.
sonar.coverage.exclusions=\
  **/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,\
  **/__tests__/**,**/__mocks__/**,**/__fixtures__/**,\
  **/*.config.ts,**/*.config.js,**/*.config.mjs,**/*.config.cjs,\
  **/vite-env.d.ts
