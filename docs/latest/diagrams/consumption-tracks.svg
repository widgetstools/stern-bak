<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="StarUI build and consumption tracks">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#8a9992"/>
  </marker>
  <marker id="arrAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#0e8f6d"/>
  </marker>
</defs>
<rect width="900" height="470" fill="#fbfcfc"/>
<text x="28" y="24" font-size="9.5" font-weight="700" letter-spacing="1.6" fill="#0b6e54" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">BUILD &amp; CONSUMPTION · THREE TRACKS, ONE TRUTH</text>
<rect x="330" y="48" width="240" height="56" rx="3" fill="#f0f3fa" stroke="#4a5d8f" stroke-width="1.4"/>
<text x="450" y="73.25" text-anchor="middle" font-size="13" font-weight="650" fill="#1c2622" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">packages/*/src</text>
<text x="450" y="87.75" text-anchor="middle" font-size="10.5" fill="#5d6b64">seven workspaces</text>
<rect x="330" y="158" width="240" height="60" rx="3" fill="#f0f3fa" stroke="#4a5d8f" stroke-width="1.4"/>
<text x="450" y="185.25" text-anchor="middle" font-size="13" font-weight="650" fill="#1c2622" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">packages/*/dist</text>
<text x="450" y="199.75" text-anchor="middle" font-size="10.5" fill="#5d6b64">+ tsconfig.consumer.json</text>
<path d="M450,104 L450,156" fill="none" stroke="#8a9992" stroke-width="1.25" marker-end="url(#arr)"/>
<text x="528" y="125" text-anchor="middle" font-size="9.5" fill="#5d6b64" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">turbo build (tsc)</text>
<rect x="60" y="288" width="230" height="72" rx="3" fill="#eefaf5" stroke="#0e8f6d" stroke-width="1.4"/>
<text x="175" y="313.75" text-anchor="middle" font-size="12.5" font-weight="650" fill="#1c2622" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">apps/source/*</text>
<text x="175" y="328.25" text-anchor="middle" font-size="10.5" fill="#5d6b64">source track</text>
<text x="175" y="342.75" text-anchor="middle" font-size="10.5" fill="#5d6b64">"did a platform change break the demos?"</text>
<path d="M390,218 L390,286 L175,286" fill="none" stroke="#8a9992" stroke-width="1.25" marker-end="url(#arr)"/>
<text x="240" y="262" text-anchor="middle" font-size="9.5" fill="#5d6b64" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">vite aliases + consumer tsconfig</text>
<rect x="345" y="288" width="210" height="56" rx="3" fill="#fdf6ea" stroke="#b07a1e" stroke-width="1.4"/>
<text x="450" y="313" text-anchor="middle" font-size="12.5" font-weight="650" fill="#1c2622" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">dist-npm/*.tgz</text>
<text x="450" y="327.5" text-anchor="middle" font-size="10.5" fill="#5d6b64">npm run pack:npm — one per package</text>
<path d="M450,218 L450,286" fill="none" stroke="#8a9992" stroke-width="1.25" marker-end="url(#arr)"/>
<text x="476" y="247" text-anchor="middle" font-size="9.5" fill="#5d6b64" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">pack</text>
<rect x="345" y="388" width="210" height="56" rx="3" fill="#fdf6ea" stroke="#b07a1e" stroke-width="1.4"/>
<text x="450" y="405.25" text-anchor="middle" font-size="11.5" font-weight="650" fill="#1c2622">apps/vendor + tarball/*</text>
<text x="450" y="419.75" text-anchor="middle" font-size="10.5" fill="#5d6b64">tarball track</text>
<text x="450" y="434.25" text-anchor="middle" font-size="10.5" fill="#5d6b64">"can an external team install this?"</text>
<path d="M450,344 L450,386" fill="none" stroke="#8a9992" stroke-width="1.25" marker-end="url(#arr)"/>
<text x="488" y="360" text-anchor="middle" font-size="9.5" fill="#5d6b64" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">vendored</text>
<rect x="630" y="288" width="220" height="56" rx="3" fill="#f6f2fb" stroke="#7a5ea6" stroke-width="1.4"/>
<text x="740" y="313.25" text-anchor="middle" font-size="13" font-weight="650" fill="#1c2622">Artifactory / registry</text>
<text x="740" y="327.75" text-anchor="middle" font-size="10.5" fill="#5d6b64">published under real names</text>
<path d="M555,316 L628,316 L628,316" fill="none" stroke="#8a9992" stroke-width="1.25" marker-end="url(#arr)"/>
<rect x="630" y="388" width="220" height="56" rx="3" fill="#f6f2fb" stroke="#7a5ea6" stroke-width="1.4"/>
<text x="740" y="413.25" text-anchor="middle" font-size="13" font-weight="650" fill="#1c2622">External consumer apps</text>
<text x="740" y="427.75" text-anchor="middle" font-size="10.5" fill="#5d6b64">plain npm install — no aliases</text>
<path d="M740,344 L740,386" fill="none" stroke="#8a9992" stroke-width="1.25" marker-end="url(#arr)"/>
<text x="28" y="456" font-size="10.5" fill="#5d6b64" font-style="italic">The tarball track keeps external consumption honest: it must build with no aliases and no access to packages/ source.</text>

</svg>
