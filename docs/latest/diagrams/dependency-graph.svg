<text x="28" y="336" font-size="10.5" fill="#5d6b64" font-style="italic">An arrow means "depends on" — and every package also depends on everything reachable further along the</text>
<text x="28" y="352" font-size="10.5" fill="#5d6b64" font-style="italic">arrows (grid really does import all six; the extra arrows are omitted because they are implied). types is the</text>
<text x="28" y="368" font-size="10.5" fill="#5d6b64" font-style="italic">root: it depends on nothing. Framework libraries (React, AG Grid, OpenFin) are peers owned by the consuming app.</text>

