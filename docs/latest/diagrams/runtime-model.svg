<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="StarUI host and port runtime model">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#8a9992"/>
  </marker>
  <marker id="arrAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#0e8f6d"/>
  </marker>
</defs>
<rect width="860" height="420" fill="#fbfcfc"/>
<text x="28" y="24" font-size="9.5" font-weight="700" letter-spacing="1.6" fill="#0b6e54" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">RUNTIME MODEL · HOSTS AND PORTS</text>
<rect x="310" y="44" width="240" height="64" rx="3" fill="#eefaf5" stroke="#0e8f6d" stroke-width="1.4"/>
<text x="430" y="66" text-anchor="middle" font-size="13" font-weight="650" fill="#1c2622">App surface</text>
<text x="430" y="80.5" text-anchor="middle" font-size="10.5" fill="#5d6b64">a grid · a panel · any view</text>
<text x="430" y="95" text-anchor="middle" font-size="10.5" fill="#5d6b64">StarGrid / MarketsGrid</text>
<rect x="310" y="168" width="240" height="58" rx="3" fill="#f0f3fa" stroke="#4a5d8f" stroke-width="1.4"/>
<text x="430" y="187" text-anchor="middle" font-size="13" font-weight="650" fill="#1c2622">Host ports</text>
<text x="430" y="201.5" text-anchor="middle" font-size="10.5" fill="#5d6b64">identity · theme · surface · data</text>
<text x="430" y="216" text-anchor="middle" font-size="10.5" fill="#5d6b64">core/host</text>
<rect x="620" y="168" width="200" height="58" rx="3" fill="#f0f3fa" stroke="#4a5d8f" stroke-width="1.4"/>
<text x="720" y="187" text-anchor="middle" font-size="13" font-weight="650" fill="#1c2622">Config store</text>
<text x="720" y="201.5" text-anchor="middle" font-size="10.5" fill="#5d6b64">Dexie / IndexedDB</text>
<text x="720" y="216" text-anchor="middle" font-size="10.5" fill="#5d6b64">core/host/config</text>
<rect x="120" y="296" width="260" height="62" rx="3" fill="#fdf6ea" stroke="#b07a1e" stroke-width="1.4"/>
<text x="250" y="317" text-anchor="middle" font-size="13" font-weight="650" fill="#1c2622">Browser adapter</text>
<text x="250" y="331.5" text-anchor="middle" font-size="10.5" fill="#5d6b64">plain browser tab</text>
<text x="250" y="346" text-anchor="middle" font-size="10.5" fill="#5d6b64">core/host/browser (BrowserRuntime)</text>
<rect x="480" y="296" width="260" height="62" rx="3" fill="#fdf6ea" stroke="#b07a1e" stroke-width="1.4"/>
<text x="610" y="317" text-anchor="middle" font-size="13" font-weight="650" fill="#1c2622">OpenFinRuntime</text>
<text x="610" y="331.5" text-anchor="middle" font-size="10.5" fill="#5d6b64">workspace · dock · notifications</text>
<text x="610" y="346" text-anchor="middle" font-size="10.5" fill="#5d6b64">openfin/host</text>
<path d="M430,108 L430,166" fill="none" stroke="#8a9992" stroke-width="1.25" marker-end="url(#arr)"/>
<text x="476" y="132" text-anchor="middle" font-size="9.5" fill="#5d6b64" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">typed ports</text>
<path d="M550,197 L618,197 L618,197" fill="none" stroke="#8a9992" stroke-width="1.25" marker-end="url(#arr)"/>
<path d="M370,226 L256,294" fill="none" stroke="#8a9992" stroke-width="1.25" marker-end="url(#arr)"/>
<path d="M490,226 L604,294" fill="none" stroke="#8a9992" stroke-width="1.25" marker-end="url(#arr)"/>
<text x="28" y="404" font-size="10.5" fill="#5d6b64" font-style="italic">The same app surface runs unchanged in a browser tab or inside an OpenFin workspace — the adapter provides the same ports.</text>

</svg>
