name: CI

on:
  push:
    branches: [main, feat/consolidation]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  install:
    name: Install + cache
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ env.NODE_VERSION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm install
        run: npm install

  quality:
    name: Lint + hygiene checks
    needs: install
    runs-on: ubuntu-latest
    steps:
      # Full history: the complexity-budget check needs a merge-base with the
      # PR's target to know what this change actually touched.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - name: ESLint (packages)
        run: npm run lint
      - name: Package dependency cycles
        run: npm run check:deps
      - name: Design-system dependency hygiene
        run: npm run check:design-system-deps
      # Diff-scoped: fails when a PR grows a function that is ALREADY over the
      # 80-line ceiling, leaving the ~192 legacy violations alone.
      #
      # REPORT-ONLY for now, and for one reason: `feature/simplify` predates
      # this check and trips it 26 times, so gating on it would block the
      # branch that introduced it. Flip `continue-on-error` off once that
      # branch has landed and its 26 are worked through — same treatment, and
      # for the same reason, as the token-policy step below.
      # See docs/WORKLOG.md item 21.
      - name: Complexity budget (changed files only, report-only)
        if: github.event_name == 'pull_request'
        run: npm run check:complexity -- --base=origin/${{ github.base_ref }}
        continue-on-error: true
      # Informational only — the design-system token migration still has a
      # known backlog of legitimate-hex exceptions. Surface it without gating.
      - name: Design-system token policy (report-only)
        run: npm run check:ds-tokens
        continue-on-error: true

  packages:
    name: Packages (build + typecheck + test)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - name: Build packages
        run: npm run build:packages
      - name: Typecheck packages
        run: npm run typecheck:packages
      - name: Unit tests (packages)
        run: npm run test:packages

  coverage:
    name: Coverage (report-only)
    needs: install
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - name: Unit tests with coverage
        run: npm run test:coverage
        continue-on-error: true
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: packages/**/coverage
          retention-days: 7
          if-no-files-found: warn


