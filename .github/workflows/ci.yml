name: CI

on:
  push:
    branches: [main, feat/consolidation]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  install:
    name: Install + cache
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ env.NODE_VERSION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm install
        run: npm install

  quality:
    name: Lint + hygiene checks
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - name: ESLint (packages)
        run: npm run lint
      - name: Package dependency cycles
        run: npm run check:deps
      - name: Design-system dependency hygiene
        run: npm run check:design-system-deps
      # Informational only — the design-system token migration still has a
      # known backlog of legitimate-hex exceptions. Surface it without gating.
      - name: Design-system token policy (report-only)
        run: npm run check:ds-tokens
        continue-on-error: true

  packages:
    name: Packages (build + typecheck + test)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - name: Build packages
        run: npm run build:packages
      - name: Typecheck packages
        run: npm run typecheck:packages
      - name: Unit tests (packages)
        run: npm run test:packages

  coverage:
    name: Coverage (report-only)
    needs: install
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - name: Unit tests with coverage
        run: npm run test:coverage
        continue-on-error: true
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: packages/**/coverage
          retention-days: 7
          if-no-files-found: warn


